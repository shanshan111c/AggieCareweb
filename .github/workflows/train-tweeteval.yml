name: Train TweetEval sadness-language hint
on:
  push:
    branches: [feature/us-campus-slang-tweeteval-v2]
    paths: ["ml/tweeteval/**", ".github/workflows/train-tweeteval.yml"]
permissions:
  contents: write
jobs:
  fit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install "numpy>=1.26,<3" "scikit-learn>=1.5,<2"
      - name: Fit official TweetEval train and validation, report held-out test metrics
        run: python ml/tweeteval/train.py
      - name: Check local-only runtime safeguards
        run: node ml/tweeteval/test-runtime.mjs
      - run: node --check docs/tweeteval-affect.js
      - name: Save only parameters and aggregate metrics to experiment branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/tweeteval-sadness-v1.json docs/tweeteval-affect.js tweeteval-affect.js docs/TWEETEVAL_EVALUATION.md
          git diff --cached --quiet || git commit -m "Fit TweetEval sadness-language baseline and evaluate"
          git push origin HEAD:feature/us-campus-slang-tweeteval-v2
