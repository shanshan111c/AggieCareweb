name: Search Intent Regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate compiled client bundle syntax
        run: |
          node --check docs/_next/static/chunks/app/page-ed393d88a196cbaa.js
          node --check _next/static/chunks/app/page-ed393d88a196cbaa.js
      - name: Check deployed search rules
        run: node scripts/test-colloquial-intents.mjs
