name: Search Intent Regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate optional GoEmotions model safeguards
        run: |
          if [ -f docs/goemotions-affect.js ]; then node ml/goemotions/test-runtime.mjs; fi
      - name: Validate compiled client bundle syntax
        run: |
          node --check docs/_next/static/chunks/app/page-ed393d88a196cbaa.js
          node --check _next/static/chunks/app/page-ed393d88a196cbaa.js
      - name: Check deployed search rules
        run: node scripts/test-colloquial-intents.mjs

  browser-smoke:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Search the actual exported site
        run: |
          mkdir -p .site-root/AggieCareweb
          cp -a docs/. .site-root/AggieCareweb/
          python3 -m http.server 8765 --bind 127.0.0.1 --directory .site-root >/tmp/aggie-site.log 2>&1 &
          node scripts/e2e-search-smoke.mjs
